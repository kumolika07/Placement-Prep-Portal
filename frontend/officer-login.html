<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placement Officer Login | PlacementPrep</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="auth-back" href="index.html">← Back to home</a>
      <div class="auth-head">
        <div class="icon" style="background:#cffafe;color:#0891b2">🏛️</div>
        <h1>Placement Officer Login</h1>
        <p>Training &amp; Placement Cell access</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input class="form-control" type="text" id="username" placeholder="e.g. officer1" autocomplete="username" />
          <div class="field-error" id="usernameError"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input class="form-control" type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
          <div class="field-error" id="passwordError"></div>
        </div>

        <button class="btn btn-lg btn-block" type="submit" id="submitBtn">Sign In</button>
      </form>

      <div class="auth-foot">
        Student? <a href="student-login.html">Go to student login</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/officer-login.js"></script>
</body>
</html>
