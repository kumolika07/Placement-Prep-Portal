<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Take Test | PlacementPrep</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="navbar"></div>

  <main class="container section">
    <!-- Loading state -->
    <div id="loading" class="empty"><div class="spinner"></div><p class="mt-2">Loading your questions...</p></div>

    <!-- Test state -->
    <div id="testState" class="hidden">
      <div class="card mb-3">
        <div class="test-header">
          <div>
            <h2 id="testTitle">Aptitude Test</h2>
            <p class="text-muted" id="testMeta"></p>
          </div>
          <div style="text-align:right">
            <div class="text-muted" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.5px">Time Left</div>
            <div class="timer" id="timer">--:--</div>
          </div>
        </div>
        <div class="progress mt-2"><span id="progressBar" style="width:0%"></span></div>
        <p class="text-muted mt-1" style="font-size:.82rem" id="answeredCount">0 answered</p>
      </div>

      <div id="questionsContainer"></div>

      <div class="flex justify-between items-center flex-wrap gap-2 mt-3">
        <a class="btn btn-ghost" href="aptitude.html">← Cancel</a>
        <button class="btn btn-lg btn-success" id="submitBtn">Submit Test</button>
      </div>
    </div>

    <!-- Result state -->
    <div id="resultState" class="hidden">
      <div id="resultBanner" class="result-banner"></div>
      <div class="flex justify-between items-center flex-wrap gap-2 mb-3">
        <h2>Answer Review</h2>
        <div class="flex gap-1">
          <a class="btn btn-outline" href="aptitude.html">Back to Tests</a>
          <a class="btn" href="student-dashboard.html">Dashboard</a>
        </div>
      </div>
      <div id="reviewContainer"></div>
    </div>
  </main>

  <footer class="site-footer"><div class="container">PlacementPrep · Timed Aptitude Test</div></footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/test.js"></script>
</body>
</html>
